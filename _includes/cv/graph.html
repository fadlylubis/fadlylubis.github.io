<a class="anchor" id="Career Graph"></a>
<div class="card mt-3 p-3">
  <h3 class="card-title font-weight-medium">Experience &amp; Skills</h3>
  <p class="cv-graph-hint">Hover to trace connections, click a node for details, drag to rearrange, scroll to zoom.</p>
  <ul class="cv-graph-legend">
    <li><span class="dot org"></span>Organization</li>
    <li><span class="dot role"></span>Role / project</li>
    <li><span class="dot category"></span>Skill area</li>
    <li><span class="dot skill"></span>Skill (bigger = used in more roles)</li>
  </ul>
  <div id="cv-graph" data-name="{{ site.first_name }} {{ site.last_name }}" data-photo="{{ 'assets/img/prof_pic.jpg' | relative_url }}"></div>
  <div id="cv-graph-panel" aria-live="polite"></div>
  <script type="application/json" id="cv-graph-data">{{ include.entries | jsonify }}</script>
</div>

<style>
  .cv-graph-hint { color: var(--global-text-color-light); font-size: 0.85rem; margin-bottom: 0.25rem; }
  .cv-graph-legend { list-style: none; padding: 0; margin: 0 0 0.5rem; display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; font-size: 0.8rem; color: var(--global-text-color-light); }
  .cv-graph-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.35rem; vertical-align: middle; }
  #cv-graph { width: 100%; height: 560px; border: 1px solid var(--global-divider-color); border-radius: 2px; overflow: hidden; touch-action: none;
    background-color: var(--global-bg-color);
    background-image: linear-gradient(rgba(60,141,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(60,141,255,.05) 1px, transparent 1px);
    background-size: 24px 24px; }
  #cv-graph svg { width: 100%; height: 100%; display: block; cursor: grab; }
  #cv-graph .link { stroke: var(--global-text-color-light); stroke-opacity: 0.25; }
  #cv-graph .link.uses { stroke: var(--global-theme-color); stroke-opacity: 0.35; stroke-dasharray: 3 3; }
  #cv-graph .node circle { stroke: var(--global-bg-color); stroke-width: 1.5px; cursor: pointer; }
  #cv-graph .node:focus { outline: none; }
  #cv-graph .node:focus circle, #cv-graph .node.selected circle { stroke: var(--global-text-color); stroke-width: 2.5px; }
  #cv-graph text { fill: var(--global-text-color); font-size: 10px; pointer-events: none; paint-order: stroke; stroke: var(--global-bg-color); stroke-width: 3px; stroke-linejoin: round; }
  #cv-graph .node.org text, #cv-graph .node.me text { font-size: 12px; font-weight: 600; }
  #cv-graph .node.minor text { display: none; }
  #cv-graph.focus .node, #cv-graph.focus .link { opacity: 0.12; transition: opacity 0.15s; }
  #cv-graph.focus .node.near, #cv-graph.focus .link.near { opacity: 1; }
  #cv-graph.focus .node.near text { display: inline; }
  .dot.me, #cv-graph .me circle { fill: var(--global-theme-color); background: var(--global-theme-color); }
  .dot.org, #cv-graph .org circle { fill: #f0a43a; background: #f0a43a; }
  .dot.role, #cv-graph .role circle { fill: #3c8dff; background: #3c8dff; }
  .dot.category, #cv-graph .category circle { fill: #2ee6d6; background: #2ee6d6; }
  .dot.skill, #cv-graph .skill circle { fill: #8496aa; background: #8496aa; }
  #cv-graph .node.selected circle, #cv-graph .node:focus circle { filter: drop-shadow(0 0 6px rgba(60,141,255,.8)); }
  #cv-graph .skill.unused circle { fill-opacity: 0.45; }
  #cv-graph .skill:not(.unused) circle { fill: #d6e0ea; }
  #cv-graph-panel { margin-top: 1rem; }
  #cv-graph-panel h4 { margin-bottom: 0.1rem; }
  #cv-graph-panel { border-left: 2px solid var(--global-theme-color); padding-left: 1rem; }
  #cv-graph-panel .meta { color: var(--global-text-color-light); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
  #cv-graph-panel ul { padding-left: 1.2rem; }
  #cv-graph-panel .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
  #cv-graph-panel .chips button { border: 1px solid var(--global-theme-color); color: var(--global-theme-color); background: transparent; border-radius: 2px; padding: 0.1rem 0.5rem; font-size: 0.75rem; font-family: 'JetBrains Mono', ui-monospace, monospace; cursor: pointer; }
  #cv-graph-panel .chips button:hover, #cv-graph-panel .chips button:focus { background: var(--global-theme-color); color: var(--global-hover-text-color); }
  @media (max-width: 576px) { #cv-graph { height: 440px; } }
</style>

<script defer src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script defer src="{{ '/assets/js/cv-graph.js' | relative_url }}"></script>
